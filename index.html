<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Labophot Companion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f0c51a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <div class="brand-name">Labophot Companion</div>
          <div class="brand-sub">Nikon Labophot 1 · Charlie's bench</div>
        </div>
      </div>
      <div class="topbar-center" id="objectiveBar"></div>
      <div class="topbar-right">
        <button class="ghost" id="btnReset" title="Reset camera (R)">Reset view</button>
        <button class="ghost" id="btnSpin" title="Toggle auto-rotate (space)">Auto-rotate</button>
        <button class="ghost" id="btnPanel" title="Toggle panel (P)">Panel</button>
        <button class="ghost" id="btnTheme" title="Toggle light / dark (T)">Light</button>
      </div>
    </header>

    <main class="stage">
      <section class="viewport" id="viewport">
        <canvas id="scene"></canvas>
        <div class="label" id="hoverLabel" hidden></div>
        <div class="viewport-hint" id="viewportHint">
          Drag to orbit · scroll to zoom · click a part to learn about it
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <aside class="panel" id="panel">
        <nav class="tabs" id="tabs">
          <button data-tab="ask" class="active">Ask</button>
          <button data-tab="parts">Parts</button>
          <button data-tab="guides">Guides</button>
          <button data-tab="session">Session</button>
          <button data-tab="history">History</button>
          <button data-tab="archive">Archive</button>
        </nav>
        <div class="panel-body" id="panelBody"></div>
      </aside>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">×</button>
    <img alt="" />
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
